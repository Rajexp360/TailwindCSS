<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Classes in Tailwind CSS</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <div class="fonts m-20">
    <p>Paragraph</p>
    <div class="font-sans">sans</div>
    <div class="font-serif">Font Serif</div>
    <div class="font-monospace">  font-monospace</div>

    <p class="text-9xl">Hello</p>
    <p class="text-8xl">Hello</p>
    <p class="text-7xl">Hello</p>
    <p class="text-6xl">Hello</p>
    <p class="text-5xl">Hello</p>
    <p class="text-4xl">Hello</p>
    <p class="text-3xl">Hello</p>
    <p class="text-2xl">Hello</p>
    <p class="text-sx">Hello</p>
    <p class="text-[100px]">one hundred</p>
    <p class="text-7xl">Hello</p>
</div>
    
</body>
</html>
